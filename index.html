<!doctype html>
<html lang="no">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eiriksbok</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(r) {
                for (var sw of r) { sw.unregister(); }
            });
        }
    </script>
    <!-- Fontene selvhostes via Fontsource (se src/main.tsx). Ingen <link> til
         fonts.googleapis.com her: den var render-blokkerende og krevde DNS +
         TLS mot to fremmede domener før første maling. -->
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
