name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Manuell/programmatisk trigger. Auto-merge-workflowen kaller denne via
  # `gh workflow run deploy.yml` etter en bot-PR-merge, fordi en merge gjort med
  # GITHUB_TOKEN ikke trigger `on: push` (GitHub hindrer rekursive workflow-kjøringer).
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Matcher lokal utvikling (Node 22). Node 20 gikk ut av support i
          # april 2026, og runneren tvang actionene over på Node 24 uansett.
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Smal lint-sjekk: bare React sine hook-regler. De er ryddet til null, og
      # dette holder dem der. Resten av lint-gjelden (mest `no-explicit-any`)
      # blokkerer ingenting ennå — se eslint.hooks.config.js.
      - name: Lint (hook-regler)
        run: npm run lint:hooks

      - name: Build
        run: npm run build

      - name: Upload artifact
        # v5 er den som drar med seg upload-artifact v7; eldre versjoner bruker
        # upload-artifact v4, som var det annotasjonen klaget på.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
